<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Twoja biblioteczka</title>
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/spines.css" />
    <link rel="stylesheet" href="/styles/room-view.css" />
    <link rel="stylesheet" href="/styles/wallpaper.css" />
    <link rel="stylesheet" href="/styles/book-motion.css" />
  </head>
  <body data-theme="light">
    <main id="bookcase" aria-label="Biblioteczka"></main>
    <div id="connection" role="status" hidden>
      Biblioteczka działa offline. Uruchom program, aby wczytać zmiany.
    </div>
    <nav id="pages" aria-label="Strony biblioteczki">
      <button id="previous" aria-label="Poprzednia strona">←</button><span id="page-label"></span
      ><button id="next" aria-label="Następna strona">→</button>
    </nav>
    <dialog id="book-card" aria-labelledby="card-title">
      <button class="close-card" aria-label="Zamknij">×</button>
      <div id="card-content"></div>
    </dialog>
    <div id="tooltip" role="tooltip" hidden></div>
    <div id="wallpaper-settings" class="wallpaper-settings" data-visible="false">
      <button type="button" id="wallpaper-settings-open" aria-label="Ustawienia">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <polygon
            points="18.74,9.21 21.27,9.52 21.27,14.48 18.74,14.79 18.74,14.79 20.31,16.80 16.80,20.31 14.79,18.74 14.79,18.74 14.48,21.27 9.52,21.27 9.21,18.74 9.21,18.74 7.20,20.31 3.69,16.80 5.26,14.79 5.26,14.79 2.73,14.48 2.73,9.52 5.26,9.21 5.26,9.21 3.69,7.20 7.20,3.69 9.21,5.26 9.21,5.26 9.52,2.73 14.48,2.73 14.79,5.26 14.79,5.26 16.80,3.69 20.31,7.20 18.74,9.21"
          />
          <circle cx="12" cy="12" r="3.1" />
        </svg></button
      ><span class="wallpaper-settings-label" aria-hidden="true">Ustawienia</span>
      <p
        id="wallpaper-settings-status"
        class="wallpaper-settings-status"
        role="status"
        aria-live="polite"
      ></p>
    </div>
    <div id="book-motion-layer">
      <div id="book-motion-shadow" aria-hidden="true" hidden></div>
      <button
        id="book-motion-volume"
        type="button"
        tabindex="-1"
        aria-label="Odłóż książkę"
        hidden
      ></button>
    </div>
    <section
      id="book-motion-info"
      class="book-motion-info"
      role="group"
      aria-labelledby="book-motion-caption"
      data-ready="false"
      hidden
      inert
    >
      <button id="book-motion-close" type="button" aria-label="Odłóż książkę" title="Odłóż książkę">
        <span aria-hidden="true">×</span>
      </button>
      <div class="book-motion-info-content" tabindex="0">
        <h2 id="book-motion-caption"></h2>
        <p id="book-motion-author"></p>
        <p id="book-motion-genre"></p>
        <p id="book-motion-date"></p>
      </div>
    </section>
    <p id="book-motion-status" class="book-motion-status" role="status" aria-live="polite"></p>
    <script type="module" src="/wallpaper/app.mjs"></script>
  </body>
</html>
